<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>推奨サプライ選択ツール</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 1rem auto;
      padding: 0 1rem;
      color: #333;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    select {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
    }
    button {
      padding: 0.4rem 0.8rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* 操作エリア */
    .controls {
      margin-bottom: 1rem;
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .btn-random {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-weight: bold;
    }
    .status-text {
      font-size: 0.85rem;
      color: #666;
    }

    /* 所持拡張・除外アコーディオン */
    details {
      margin-bottom: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
    }
    details summary {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }
    .details-content {
      padding: 0.5rem 0.75rem;
      border-top: 1px solid #ddd;
      background: #fff;
    }
    .btn-group {
      margin-bottom: 0.5rem;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .exp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.3rem;
      font-size: 0.85rem;
    }
    .exp-item label {
      cursor: pointer;
      margin-left: 0.25rem;
    }

    .excluded-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
    .excluded-item {
      display: flex;
      justify-content: space-between;
      padding: 0.2rem 0;
      border-bottom: 1px solid #eee;
    }
    .excluded-item label {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-left: 0.25rem;
    }
    .excluded-item .exp-label {
      color: #888;
      font-size: 0.8em;
    }

    /* 結果表示 */
    .result {
      margin-top: 1rem;
      padding: 1rem;
      background: #f0f0f0;
      border-radius: 8px;
    }
    .result h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }
    .supply-header {
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #ddd;
    }
    .supply-header h2 {
      margin: 0 0 0.25rem;
      font-size: 1.3rem;
    }
    .supply-header .expansion-name {
      color: #666;
      font-size: 0.9rem;
    }
    .section-title {
      font-size: 1rem;
      margin: 1rem 0 0.5rem;
      color: #444;
    }
    .card-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .card-list li {
      padding: 0.25rem 0;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    .card-list li:last-child {
      border-bottom: none;
    }
    .card-set {
      color: #666;
      font-size: 0.9em;
      white-space: nowrap;
    }
    .card-types {
      font-size: 0.85em;
      color: #555;
      margin-right: auto;
    }
    .colony-shelter {
      margin-top: 1rem;
      padding-top: 0.5rem;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 2rem;
      font-size: 0.9rem;
    }
    .colony-shelter span {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>推奨サプライ一覧</h1>

  <div class="controls">
    <!-- 所持拡張の選択 -->
    <details id="expansion-panel">
      <summary>所持拡張の選択 (<span id="owned-count-badge">...</span>)</summary>
      <div class="details-content">
        <div class="btn-group">
          <button id="btn-select-all-exp" type="button">すべて選択</button>
          <button id="btn-deselect-all-exp" type="button">すべて解除</button>
          <button id="btn-select-v2-exp" type="button">第二版＋拡張</button>
        </div>
        <div id="expansion-grid" class="exp-grid"></div>
      </div>
    </details>

    <!-- ランダムボタン & 絞り込み -->
    <div class="action-row">
      <button id="btn-random" class="btn-random" type="button">ランダム選択</button>
      <label style="font-size: 0.9rem; cursor: pointer;">
        <input type="checkbox" id="chk-filter-playable" checked>
        所持サプライのみ表示
      </label>
      <span id="playable-status" class="status-text"></span>
    </div>

    <!-- サプライ選択セレクトボックス -->
    <p style="margin: 0.5rem 0 0.25rem;">
      <label for="supply-select">サプライ選択:</label><br>
      <select id="supply-select" size="1"></select>
    </p>

    <!-- 個別除外設定 -->
    <details id="exclude-panel" style="margin-top: 0.5rem;">
      <summary style="font-size: 0.85rem; color: #666;">サプライの個別除外・確認 (<span id="eligible-supplies-count">0</span>件)</summary>
      <div class="details-content">
        <div id="eligible-supplies-list" class="excluded-list"></div>
      </div>
    </details>
  </div>

  <!-- 結果表示 -->
  <div id="cards-result" class="result">
    <div class="supply-header">
      <h2 id="current-supply-name">サプライ名</h2>
      <div id="current-supply-exp" class="expansion-name">拡張名</div>
    </div>

    <div class="section-title">王国カード <span id="kingdom-count" style="font-size:0.85em; color:#666;"></span></div>
    <ul id="kingdom-list" class="card-list"></ul>

    <div class="section-title">追加カード <span id="extra-count" style="font-size:0.85em; color:#666;"></span></div>
    <ul id="extra-list" class="card-list"></ul>

    <div id="colony-shelter" class="colony-shelter"></div>
  </div>

  <script type="module">
    // --- 拡張の定義 ---
    const EXPANSION_DEFS = [
      { id: 'base_v1', name: '基本 (初版)', group: '基本' },
      { id: 'base_v2', name: '基本 (第二版)', group: '基本' },
      { id: 'intrigue_v1', name: '陰謀 (初版)', group: '陰謀' },
      { id: 'intrigue_v2', name: '陰謀 (第二版)', group: '陰謀' },
      { id: 'seaside_v1', name: '海辺 (初版)', group: '海辺' },
      { id: 'seaside_v2', name: '海辺 (第二版)', group: '海辺' },
      { id: 'alchemy', name: '錬金術', group: '錬金術' },
      { id: 'prosperity_v1', name: '繁栄 (初版)', group: '繁栄' },
      { id: 'prosperity_v2', name: '繁栄 (第二版)', group: '繁栄' },
      { id: 'cornucopia', name: '収穫祭', group: '収穫祭' },
      { id: 'hinterlands_v1', name: '異郷 (初版)', group: '異郷' },
      { id: 'hinterlands_v2', name: '異郷 (第二版)', group: '異郷' },
      { id: 'dark_ages', name: '暗黒時代', group: '暗黒時代' },
      { id: 'guilds_v1', name: 'ギルド (初版)', group: 'ギルド' },
      { id: 'guilds_v2', name: 'ギルド (第二版)', group: 'ギルド' },
      { id: 'adventures', name: '冒険', group: '冒険' },
      { id: 'empires', name: '帝国', group: '帝国' },
      { id: 'nocturne', name: '夜想曲', group: '夜想曲' },
      { id: 'renaissance', name: 'ルネサンス', group: 'ルネサンス' },
      { id: 'menagerie', name: '移動動物園', group: '移動動物園' },
      { id: 'allies', name: '同盟', group: '同盟' },
      { id: 'plunder', name: '略奪', group: '略奪' },
      { id: 'rising_sun', name: '旭日', group: '旭日' },
    ];

    // 初版限定（廃版）カード一覧
    const V1_ONLY_CARDS = {
      '基本': ['木こり', '泥棒', '宰相', '祝宴', '密偵', '冒険者'],
      '陰謀': ['秘密の部屋', '大広間', '銅細工師', '偵察員', 'トリビュート', '破壊工作員'],
      '海辺': ['抑留', '真珠採り', '海の妖婆', '探索', '海賊船', '幽霊船', '商船', '探検家'],
      '繁栄': ['借金', '投機', '記念碑', '護符', '会計所', '行商人', '禁制品', 'ペテン師', '隠し財産', '望楼'],
      '異郷': ['公爵領の敷地', '大使館', 'シルクロード', '遊牧民の野営地', 'よろずや', '神託', '義賊', '開発', '埋蔵金'],
      'ギルド': ['名品', '収税吏', '医師', '預言者']
    };

    // 分割カード（Split Piles）の定義（帝国・プロモ）
    const SPLIT_PILES = [
      {
        names: ['開拓者', '騒がしい村'],
        mergedName: '開拓者 / 騒がしい村',
        cost: '2 / 5',
        type: 'アクション',
        set: '帝国',
        note: '開拓者(2) / 騒がしい村(5)'
      },
      {
        names: ['パトリキ', 'エンポリウム'],
        mergedName: 'パトリキ / エンポリウム',
        cost: '2 / 5',
        type: 'アクション',
        set: '帝国',
        note: 'パトリキ(2) / エンポリウム(5)'
      },
      {
        names: ['投石機', '石'],
        mergedName: '投石機 / 石',
        cost: '3 / 4',
        type: 'アクション－アタック / 財宝',
        set: '帝国',
        note: '投石機(3) / 石(4)'
      },
      {
        names: ['陣地', '鹵獲品'],
        mergedName: '陣地 / 鹵獲品',
        cost: '2 / 5',
        type: 'アクション / 財宝',
        set: '帝国',
        note: '陣地(2) / 鹵獲品(5)'
      },
      {
        names: ['剣闘士', '大金'],
        check: n => n === '剣闘士' || n.startsWith('大金'),
        mergedName: '剣闘士 / 大金',
        cost: '3 / 8+8D',
        type: 'アクション / 財宝',
        set: '帝国',
        note: '剣闘士(3) / 大金(8+8負債)'
      },
      {
        names: ['サウナ', 'アヴァント'],
        mergedName: 'サウナ / アヴァント',
        cost: '4 / 5',
        type: 'アクション',
        set: 'プロモ',
        note: 'サウナ(4) / アヴァント(5)'
      }
    ];

    // 特殊カード・辞書補完
    const MANUAL_CARD_OVERRIDES = {
      '城': {
        name_ja: '城',
        cost: '3〜10',
        type: '勝利点－城',
        set: '帝国',
        note: '粗末な城(3), 崩れた城(4), 小さい城(5), 幽霊城(6), 華やかな城(7), 広大な城(8), 壮大な城(9), 王城(10)'
      },
      '騎士': {
        name_ja: '騎士',
        cost: '5',
        type: 'アクション－アタック－騎士',
        set: '暗黒時代',
        note: 'デイム・アンナ〜サー・ヴァンデル(10種)'
      },
      'ハーレム': {
        name_ja: 'ハーレム',
        cost: '6',
        type: '財宝－勝利点',
        set: '陰謀'
      },
      '大金': {
        name_ja: '大金',
        cost: '8+8D',
        type: '財宝',
        set: '帝国'
      },
      // 同盟分割山札名
      '町民': { name_ja: '町民', cost: '2〜5', type: 'アクション－町民', set: '同盟' },
      '城砦': { name_ja: '城砦', cost: '3〜6', type: 'アクション－城砦', set: '同盟' },
      '衝突': { name_ja: '衝突', cost: '3〜6', type: 'アクション－衝突', set: '同盟' },
      '卜占官': { name_ja: '卜占官', cost: '3〜6', type: 'アクション－卜占官', set: '同盟' },
      '魔法使い': { name_ja: '魔法使い', cost: '3〜6', type: 'アクション－魔法使い', set: '同盟' },
      '叙事詩': { name_ja: '叙事詩', cost: '3〜6', type: 'アクション－叙事詩', set: '同盟' },
      // 収穫祭＆ギルド第2版
      'Infirmary': { name_ja: 'Infirmary', cost: '4', type: 'アクション', set: '収穫祭＆ギルド' },
      'Farmhands': { name_ja: 'Farmhands', cost: '4', type: 'アクション', set: '収穫祭＆ギルド' },
      'Carnival': { name_ja: 'Carnival', cost: '5', type: 'アクション', set: '収穫祭＆ギルド' },
      'Farrier': { name_ja: 'Farrier', cost: '2', type: 'アクション', set: '収穫祭＆ギルド' },
      'Shop': { name_ja: 'Shop', cost: '3', type: 'アクション', set: '収穫祭＆ギルド' },
      'Joust': { name_ja: 'Joust', cost: '5', type: 'アクション', set: '収穫祭＆ギルド' },
      'Ferryman': { name_ja: 'Ferryman', cost: '5', type: 'アクション', set: '収穫祭＆ギルド' },
      'Footpad': { name_ja: 'Footpad', cost: '5', type: 'アクション－アタック', set: '収穫祭＆ギルド' },
      '肖像': { name_ja: '肖像', cost: '5', type: 'アクション', set: '略奪' }
    };

    // LocalStorage キー
    const STORAGE_KEY_OWNED = 'dominion_owned_expansions_v1';
    const STORAGE_KEY_EXCLUDED = 'dominion_excluded_supplies_v1';
    const STORAGE_KEY_FILTER_ONLY = 'dominion_filter_only_playable_v1';

    // DOM要素
    const ownedCountBadgeEl = document.getElementById('owned-count-badge');
    const expansionGridEl = document.getElementById('expansion-grid');
    const btnSelectAllExp = document.getElementById('btn-select-all-exp');
    const btnDeselectAllExp = document.getElementById('btn-deselect-all-exp');
    const btnSelectV2Exp = document.getElementById('btn-select-v2-exp');

    const btnRandomEl = document.getElementById('btn-random');
    const playableStatusEl = document.getElementById('playable-status');
    const chkFilterPlayableEl = document.getElementById('chk-filter-playable');
    const selectEl = document.getElementById('supply-select');

    const eligibleSuppliesCountEl = document.getElementById('eligible-supplies-count');
    const eligibleSuppliesListEl = document.getElementById('eligible-supplies-list');

    const currentSupplyNameEl = document.getElementById('current-supply-name');
    const currentSupplyExpEl = document.getElementById('current-supply-exp');
    const kingdomListEl = document.getElementById('kingdom-list');
    const extraListEl = document.getElementById('extra-list');
    const kingdomCountEl = document.getElementById('kingdom-count');
    const extraCountEl = document.getElementById('extra-count');
    const colonyShelterEl = document.getElementById('colony-shelter');

    // アプリケーション状態
    let supplyList = [];
    let cardDataLookup = new Map();
    let ownedExpansions = new Set();
    let excludedSupplyKeys = new Set();
    let filterOnlyPlayable = true;

    function normalizeName(s) {
      if (!s || typeof s !== 'string') return '';
      return s.trim();
    }

    function escapeHtml(s) {
      if (s == null) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function getSupplyKey(supply) {
      return `${supply.expansion}::${supply.name}`;
    }

    /** カード情報 Lookup 構築 */
    function buildCardDataLookup(dominionCardsData) {
      const map = new Map();
      if (!dominionCardsData || !dominionCardsData.cards) return map;
      for (const c of dominionCardsData.cards) {
        const nameJa = normalizeName(c.name_ja != null ? c.name_ja : '');
        if (nameJa && !map.has(nameJa)) map.set(nameJa, c);
      }
      return map;
    }

    /** カード情報（セット、タイプ、コスト等）の解決 */
    function resolveCardInfo(rawCardName, lookup) {
      let name = normalizeName(rawCardName);
      if (name.startsWith('大金(')) name = '大金';
      if (name.endsWith('(5)')) name = name.replace('(5)', '').trim();

      if (MANUAL_CARD_OVERRIDES[name]) {
        return MANUAL_CARD_OVERRIDES[name];
      }
      if (lookup.has(name)) {
        return lookup.get(name);
      }

      // 特性付きカードのフォールバック（例: "近隣の パトリキ" -> "パトリキ"）
      if (name.includes(' ')) {
        const parts = name.split(/\s+/);
        const baseName = parts[parts.length - 1];
        if (lookup.has(baseName)) {
          const parent = lookup.get(baseName);
          return Object.assign({}, parent, { name_ja: name });
        }
      }

      // 恵み
      if (name.includes('恵み')) {
        return { name_ja: name, type: '恵み', set: '夜想曲' };
      }

      return null;
    }

    /**
     * 王国カードの正規化（城など1サプライに複数種類ある分割カードを1行にマージ）
     */
    function normalizeKingdomCards(rawCards, lookup) {
      if (!rawCards || !rawCards.length) return [];
      let list = rawCards.map(c => {
        const info = resolveCardInfo(c.name, lookup);
        return {
          name: c.name,
          cost: c.cost != null ? c.cost : (info && info.cost != null ? info.cost : ''),
          type: info && info.type != null ? info.type : '',
          set: info && info.set != null ? info.set : '—',
          note: info && info.note != null ? info.note : '',
          raw: c
        };
      });

      // 城・騎士の特別正規化
      list = list.map(card => {
        if (card.name === '城') {
          return {
            name: '城',
            cost: '3〜10',
            type: '勝利点－城',
            set: '帝国',
            note: '粗末な城〜王城（8種）',
            raw: card.raw
          };
        }
        if (card.name === '騎士') {
          return {
            name: '騎士',
            cost: '5',
            type: 'アクション－アタック－騎士',
            set: '暗黒時代',
            note: 'デイム・アンナ〜サー・ヴァンデル（10種）',
            raw: card.raw
          };
        }
        return card;
      });

      // 帝国の分割カードペアを1行にマージ
      for (const pair of SPLIT_PILES) {
        const matchIndices = [];
        list.forEach((c, idx) => {
          const isMatch = pair.check ? pair.check(c.name) : pair.names.includes(c.name);
          if (isMatch) matchIndices.push(idx);
        });

        if (matchIndices.length >= 2) {
          const firstIdx = matchIndices[0];
          const mergedCard = {
            name: pair.mergedName,
            cost: pair.cost,
            type: pair.type,
            set: pair.set,
            note: pair.note,
            isSplit: true
          };
          const removeSet = new Set(matchIndices.slice(1));
          list = list.filter((_, idx) => !removeSet.has(idx));
          list[firstIdx] = mergedCard;
        }
      }

      return list;
    }

    /**
     * サプライが所持拡張でプレイ可能か判定する
     */
    function canPlaySupply(supply, owned) {
      const parts = supply.expansion.split('+').map(p => p.replace(/のみ$/, '').trim());
      const kingdomCardNames = (supply.kingdom_cards || []).map(c => c.name);

      for (const part of parts) {
        if (part === '基本(初版)') {
          if (!owned.has('base_v1')) return false;
        } else if (part === '基本(第二版)') {
          if (!owned.has('base_v2')) return false;
        } else if (part === '基本') {
          const hasV1 = owned.has('base_v1');
          const hasV2 = owned.has('base_v2');
          if (!hasV1 && !hasV2) return false;
          if (!hasV1 && hasV2) {
            if (kingdomCardNames.some(n => V1_ONLY_CARDS['基本'].includes(n))) return false;
          }
        } else if (part === '陰謀(初版)') {
          if (!owned.has('intrigue_v1')) return false;
        } else if (part === '陰謀(第二版)') {
          if (!owned.has('intrigue_v2')) return false;
        } else if (part === '陰謀') {
          const hasV1 = owned.has('intrigue_v1');
          const hasV2 = owned.has('intrigue_v2');
          if (!hasV1 && !hasV2) return false;
          if (!hasV1 && hasV2) {
            if (kingdomCardNames.some(n => V1_ONLY_CARDS['陰謀'].includes(n))) return false;
          }
        } else if (part === '海辺(初版)') {
          if (!owned.has('seaside_v1')) return false;
        } else if (part === '海辺(第二版)') {
          if (!owned.has('seaside_v2')) return false;
        } else if (part === '海辺') {
          const hasV1 = owned.has('seaside_v1');
          const hasV2 = owned.has('seaside_v2');
          if (!hasV1 && !hasV2) return false;
          if (!hasV1 && hasV2) {
            if (kingdomCardNames.some(n => V1_ONLY_CARDS['海辺'].includes(n))) return false;
          }
        } else if (part === '繁栄(第二版)') {
          if (!owned.has('prosperity_v2')) return false;
        } else if (part === '繁栄') {
          const hasV1 = owned.has('prosperity_v1');
          const hasV2 = owned.has('prosperity_v2');
          if (!hasV1 && !hasV2) return false;
          if (!hasV1 && hasV2) {
            if (kingdomCardNames.some(n => V1_ONLY_CARDS['繁栄'].includes(n))) return false;
          }
        } else if (part === '異郷(第二版)') {
          if (!owned.has('hinterlands_v2')) return false;
        } else if (part === '異郷') {
          const hasV1 = owned.has('hinterlands_v1');
          const hasV2 = owned.has('hinterlands_v2');
          if (!hasV1 && !hasV2) return false;
          if (!hasV1 && hasV2) {
            if (kingdomCardNames.some(n => V1_ONLY_CARDS['異郷'].includes(n))) return false;
          }
        } else if (part === 'ギルド(第二版)') {
          if (!owned.has('guilds_v2')) return false;
        } else if (part === 'ギルド') {
          const hasV1 = owned.has('guilds_v1');
          const hasV2 = owned.has('guilds_v2');
          if (!hasV1 && !hasV2) return false;
          if (!hasV1 && hasV2) {
            if (kingdomCardNames.some(n => V1_ONLY_CARDS['ギルド'].includes(n))) return false;
          }
        } else if (part === '錬金術') {
          if (!owned.has('alchemy')) return false;
        } else if (part === '収穫祭') {
          if (!owned.has('cornucopia')) return false;
        } else if (part === '暗黒時代') {
          if (!owned.has('dark_ages')) return false;
        } else if (part === '冒険') {
          if (!owned.has('adventures')) return false;
        } else if (part === '帝国') {
          if (!owned.has('empires')) return false;
        } else if (part === '夜想曲') {
          if (!owned.has('nocturne')) return false;
        } else if (part === 'ルネサンス') {
          if (!owned.has('renaissance')) return false;
        } else if (part === '移動動物園') {
          if (!owned.has('menagerie')) return false;
        } else if (part === '同盟') {
          if (!owned.has('allies')) return false;
        } else if (part === '略奪') {
          if (!owned.has('plunder')) return false;
        } else if (part === '旭日') {
          if (!owned.has('rising_sun')) return false;
        }
      }
      return true;
    }

    /** プレイ可能＆除外されていないサプライリストの取得 */
    function getPlayableSupplies() {
      return supplyList
        .map((s, index) => ({ supply: s, index, key: getSupplyKey(s) }))
        .filter(item => canPlaySupply(item.supply, ownedExpansions))
        .filter(item => !excludedSupplyKeys.has(item.key));
    }

    /** 所持拡張の保存と読み込み */
    function loadSavedState() {
      try {
        const savedOwned = localStorage.getItem(STORAGE_KEY_OWNED);
        if (savedOwned) {
          const arr = JSON.parse(savedOwned);
          ownedExpansions = new Set(arr);
        } else {
          ownedExpansions = new Set(EXPANSION_DEFS.map(e => e.id));
        }

        const savedExcluded = localStorage.getItem(STORAGE_KEY_EXCLUDED);
        if (savedExcluded) {
          excludedSupplyKeys = new Set(JSON.parse(savedExcluded));
        }

        const savedFilterOnly = localStorage.getItem(STORAGE_KEY_FILTER_ONLY);
        if (savedFilterOnly !== null) {
          filterOnlyPlayable = savedFilterOnly === 'true';
          chkFilterPlayableEl.checked = filterOnlyPlayable;
        }
      } catch (err) {
        console.error('Failed to load localStorage', err);
        ownedExpansions = new Set(EXPANSION_DEFS.map(e => e.id));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY_OWNED, JSON.stringify(Array.from(ownedExpansions)));
        localStorage.setItem(STORAGE_KEY_EXCLUDED, JSON.stringify(Array.from(excludedSupplyKeys)));
        localStorage.setItem(STORAGE_KEY_FILTER_ONLY, String(filterOnlyPlayable));
      } catch (err) {
        console.error('Failed to save state to localStorage', err);
      }
    }

    /** 所持拡張チェックボックスの描画 */
    function renderExpansionCheckboxes() {
      expansionGridEl.innerHTML = '';
      EXPANSION_DEFS.forEach(exp => {
        const div = document.createElement('div');
        div.className = 'exp-item';

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.id = `exp-${exp.id}`;
        chk.checked = ownedExpansions.has(exp.id);
        chk.addEventListener('change', () => {
          if (chk.checked) {
            ownedExpansions.add(exp.id);
          } else {
            ownedExpansions.delete(exp.id);
          }
          saveState();
          onExpansionChange();
        });

        const lbl = document.createElement('label');
        lbl.htmlFor = `exp-${exp.id}`;
        lbl.textContent = exp.name;

        div.appendChild(chk);
        div.appendChild(lbl);
        expansionGridEl.appendChild(div);
      });

      updateOwnedCountBadge();
    }

    function updateOwnedCountBadge() {
      const count = ownedExpansions.size;
      const total = EXPANSION_DEFS.length;
      ownedCountBadgeEl.textContent = `${count} / ${total}`;
    }

    /** サプライ選択ドロップダウンの更新 */
    function updateSupplySelect(selectedRawIndex = null) {
      const prevVal = selectedRawIndex !== null ? selectedRawIndex : parseInt(selectEl.value, 10);
      selectEl.innerHTML = '';

      const itemsToShow = [];
      supplyList.forEach((item, i) => {
        const isPlayable = canPlaySupply(item, ownedExpansions);
        const isExcluded = excludedSupplyKeys.has(getSupplyKey(item));

        if (!filterOnlyPlayable || (isPlayable && !isExcluded)) {
          itemsToShow.push({
            rawIndex: i,
            label: `${item.expansion} — ${item.name}`,
            isPlayable,
            isExcluded
          });
        }
      });

      if (itemsToShow.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '（該当するサプライがありません）';
        selectEl.appendChild(opt);
        selectEl.disabled = true;
        btnRandomEl.disabled = true;
        renderEmptySupply();
        return;
      }

      selectEl.disabled = false;
      btnRandomEl.disabled = false;

      let foundPrev = false;
      itemsToShow.forEach(it => {
        const opt = document.createElement('option');
        opt.value = it.rawIndex;
        opt.textContent = it.label;
        if (it.rawIndex === prevVal) {
          opt.selected = true;
          foundPrev = true;
        }
        selectEl.appendChild(opt);
      });

      if (!foundPrev && itemsToShow.length > 0) {
        selectEl.value = itemsToShow[0].rawIndex;
      }

      onSelectChange();
    }

    /** 対象サプライ個別除外リストの更新 */
    function updateEligibleSuppliesList() {
      const eligible = supplyList
        .map((s, idx) => ({ supply: s, index: idx, key: getSupplyKey(s) }))
        .filter(item => canPlaySupply(item.supply, ownedExpansions));

      eligibleSuppliesCountEl.textContent = eligible.length;
      eligibleSuppliesListEl.innerHTML = '';

      if (eligible.length === 0) {
        eligibleSuppliesListEl.innerHTML = '<div style="color:#888; padding:0.25rem 0;">該当サプライなし</div>';
        return;
      }

      eligible.forEach(item => {
        const row = document.createElement('div');
        row.className = 'excluded-item';

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.id = `supp-chk-${item.index}`;
        chk.checked = !excludedSupplyKeys.has(item.key);

        chk.addEventListener('change', () => {
          if (chk.checked) {
            excludedSupplyKeys.delete(item.key);
          } else {
            excludedSupplyKeys.add(item.key);
          }
          saveState();
          updatePlayableStatus();
          updateSupplySelect();
        });

        const lbl = document.createElement('label');
        lbl.htmlFor = `supp-chk-${item.index}`;
        lbl.innerHTML = `<span>${escapeHtml(item.supply.name)}</span><span class="exp-label">${escapeHtml(item.supply.expansion)}</span>`;

        row.appendChild(chk);
        row.appendChild(lbl);
        eligibleSuppliesListEl.appendChild(row);
      });
    }

    function updatePlayableStatus() {
      const playable = getPlayableSupplies();
      playableStatusEl.textContent = `対象: ${playable.length} 件`;
      btnRandomEl.disabled = playable.length === 0;
    }

    function onExpansionChange() {
      updateOwnedCountBadge();
      updatePlayableStatus();
      updateEligibleSuppliesList();
      updateSupplySelect();
    }

    /** カードリストの描画 */
    function renderCardList(listEl, cards, isKingdom = true) {
      listEl.innerHTML = '';
      if (!cards || !cards.length) {
        const li = document.createElement('li');
        li.textContent = '（なし）';
        listEl.appendChild(li);
        return;
      }

      const sortedCards = isKingdom
        ? [...cards].sort((a, b) => (a.set || '').localeCompare(b.set || '', 'ja'))
        : [...cards];

      for (const card of sortedCards) {
        const li = document.createElement('li');
        const costStr = card.cost ? ` (${escapeHtml(card.cost)})` : '';

        li.innerHTML = `
          <span>${escapeHtml(card.name)}${costStr}</span>
          <span class="card-types">${escapeHtml(card.type || '')}</span>
          <span class="card-set">${escapeHtml(card.set || '—')}</span>
        `;
        if (card.note) {
          li.title = card.note;
        }
        listEl.appendChild(li);
      }
    }

    function renderColonyShelter(item) {
      const colony = item.colony === true;
      const shelter = item.shelter === true;
      colonyShelterEl.innerHTML = `
        <div><span>植民地/プラチナ:</span> ${colony ? '使用' : '不使用'}</div>
        <div><span>避難所:</span> ${shelter ? '使用' : '不使用'}</div>
      `;
    }

    function renderEmptySupply() {
      currentSupplyNameEl.textContent = '—';
      currentSupplyExpEl.textContent = '—';
      kingdomListEl.innerHTML = '<li>（サプライが選択されていません）</li>';
      extraListEl.innerHTML = '<li>（なし）</li>';
      kingdomCountEl.textContent = '';
      extraCountEl.textContent = '';
      colonyShelterEl.innerHTML = '';
    }

    function renderSupplyDetail(item) {
      if (!item) {
        renderEmptySupply();
        return;
      }

      currentSupplyNameEl.textContent = item.name;
      currentSupplyExpEl.textContent = item.expansion;

      // 王国カードの正規化（城や分割カードを1行化）
      const normKingdomCards = normalizeKingdomCards(item.kingdom_cards || [], cardDataLookup);
      renderCardList(kingdomListEl, normKingdomCards, true);
      kingdomCountEl.textContent = `(${normKingdomCards.length})`;

      // 追加カードの正規化
      const normExtraCards = (item.extra_cards || []).map(c => {
        const info = resolveCardInfo(c.name, cardDataLookup);
        return {
          name: c.name,
          cost: c.cost != null ? c.cost : (info && info.cost != null ? info.cost : ''),
          type: info && info.type != null ? info.type : '',
          set: info && info.set != null ? info.set : '—',
          note: info && info.note != null ? info.note : ''
        };
      });
      renderCardList(extraListEl, normExtraCards, false);
      extraCountEl.textContent = normExtraCards.length ? `(${normExtraCards.length})` : '';

      renderColonyShelter(item);
    }

    function onSelectChange() {
      const rawIndex = parseInt(selectEl.value, 10);
      if (isNaN(rawIndex) || !supplyList[rawIndex]) {
        renderEmptySupply();
        return;
      }
      renderSupplyDetail(supplyList[rawIndex]);
    }

    /** ランダムにサプライを決定 */
    function pickRandomSupply() {
      const playable = getPlayableSupplies();
      if (playable.length === 0) {
        alert('現在抽選可能なサプライがありません。所持拡張を選択するか、除外を解除してください。');
        return;
      }

      const randomIndex = Math.floor(Math.random() * playable.length);
      const chosen = playable[randomIndex];
      updateSupplySelect(chosen.index);
    }

    async function init() {
      try {
        const [listRes, cardsRes] = await Promise.all([
          fetch('supply_list.json'),
          fetch('dominion_cards.json'),
        ]);

        if (!listRes.ok || !cardsRes.ok) {
          selectEl.innerHTML = '<option>JSON の読み込みに失敗しました（Webサーバー経由で開いてください）</option>';
          return;
        }

        const supplyListData = await listRes.json();
        const dominionCardsData = await cardsRes.json();

        supplyList = supplyListData.supplies || [];
        cardDataLookup = buildCardDataLookup(dominionCardsData);

        // 保存された状態をロード
        loadSavedState();

        // 拡張グリッド描画
        renderExpansionCheckboxes();

        // 操作ボタンイベント
        btnSelectAllExp.addEventListener('click', () => {
          ownedExpansions = new Set(EXPANSION_DEFS.map(e => e.id));
          document.querySelectorAll('.exp-item input[type="checkbox"]').forEach(c => c.checked = true);
          saveState();
          onExpansionChange();
        });

        btnDeselectAllExp.addEventListener('click', () => {
          ownedExpansions.clear();
          document.querySelectorAll('.exp-item input[type="checkbox"]').forEach(c => c.checked = false);
          saveState();
          onExpansionChange();
        });

        btnSelectV2Exp.addEventListener('click', () => {
          const v2Ids = EXPANSION_DEFS
            .filter(e => !e.id.endsWith('_v1'))
            .map(e => e.id);
          ownedExpansions = new Set(v2Ids);
          document.querySelectorAll('.exp-item input[type="checkbox"]').forEach(chk => {
            const id = chk.id.replace('exp-', '');
            chk.checked = ownedExpansions.has(id);
          });
          saveState();
          onExpansionChange();
        });

        // フィルタトグル
        chkFilterPlayableEl.addEventListener('change', () => {
          filterOnlyPlayable = chkFilterPlayableEl.checked;
          saveState();
          updateSupplySelect();
        });

        // サプライ選択変更
        selectEl.addEventListener('change', onSelectChange);

        // ランダムボタン
        btnRandomEl.addEventListener('click', pickRandomSupply);

        // 初期描画
        updatePlayableStatus();
        updateEligibleSuppliesList();
        updateSupplySelect();

      } catch (err) {
        console.error('Init error:', err);
        selectEl.innerHTML = '<option>データの初期化中にエラーが発生しました</option>';
      }
    }

    init();
  </script>
</body>
</html>
